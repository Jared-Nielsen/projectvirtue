[build]
  base = "."
  command = "pnpm --filter @br/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "10"
  # Anything prefixed VITE_ or PUBLIC_ is intentionally inlined into the
  # browser bundle (and may also appear in tracked docs that explain the
  # values). They are not secrets — opt these names out of Netlify's
  # secrets scanner so the build passes when the value also lives in
  # repo code/docs. Real server-side secrets (Cloudflare/Netlify/etc.
  # access keys) stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "VITE_R2_BASE_URL,VITE_SITE_BASE_URL,VITE_API_BASE_URL,VITE_PLAUSIBLE_DOMAIN,VITE_SENTRY_DSN,PUBLIC_R2_BASE_URL,PUBLIC_GAME_BASE_URL,PUBLIC_PLAUSIBLE_DOMAIN,PUBLIC_PLAUSIBLE_API_HOST,PUBLIC_NEWSLETTER_FORM_ID"

# SPA fallback — the game client is a Vite SPA with @solidjs/router doing
# client-side routing for /play/*, /character, /character/create, /home,
# /login, /loading/:variant, /play/editor, etc. Without this rewrite a
# direct visit (or refresh) on any of those URLs would return 404 because
# Netlify can't find a matching file in dist/. The 200 status keeps the
# URL bar showing the requested path while serving the SPA shell, which
# then hydrates the right route.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "interest-cohort=()"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
