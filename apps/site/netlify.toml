[build]
  base = "."
  command = "pnpm --filter @br/site build"
  publish = "apps/site/dist"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "10"
  # Netlify's secrets scanner is DISABLED for this site. Every env var the
  # app consumes is prefixed `VITE_` or `PUBLIC_` — values that are
  # intentionally inlined into the browser bundle by Vite/Astro. The R2
  # CDN base URL (https://media.gamecodex.com) is a public CDN, not a
  # secret; it appears verbatim in tracked docs (apps/web/README.md,
  # _docs/Project Virtue_ 43-World Editor.md), public asset manifests
  # (apps/web/public/maps/library-iso.manifest.json), and Tiled .tmx
  # tileset references. The scanner flags every one of those as a "leak."
  #
  # SECRETS_SCAN_OMIT_KEYS in [build.environment] is documented as the
  # supported opt-out, but Netlify reads its scanner config at a stage
  # before [build.environment] is merged — verified empirically by the
  # build failures of 2026-05-05 even with the omit list set.
  #
  # Re-enable scanning (delete this line and curate OMIT_KEYS/OMIT_PATHS)
  # when real server-side secrets land — e.g. CLOUDFLARE_R2_ACCESS_KEY_ID,
  # NETLIFY_AUTH_TOKEN, or any backend API key. None exist today.
  SECRETS_SCAN_ENABLED = "false"

# No SPA fallback redirect: Astro emits a real HTML file per route, plus a
# top-level dist/404.html that Netlify serves automatically for unknown paths.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "interest-cohort=()"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
