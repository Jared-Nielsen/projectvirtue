[build]
  base = "."
  command = "pnpm --filter @br/site build"
  publish = "apps/site/dist"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "10"
  # Anything prefixed PUBLIC_ or VITE_ is intentionally inlined into the
  # browser bundle (and may also appear in tracked docs that explain the
  # values). They are not secrets — opt these names out of Netlify's
  # secrets scanner so the build passes when the value also lives in
  # repo code/docs. Real server-side secrets (Cloudflare/Netlify/etc.
  # access keys) stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "VITE_R2_BASE_URL,VITE_SITE_BASE_URL,VITE_API_BASE_URL,VITE_PLAUSIBLE_DOMAIN,VITE_SENTRY_DSN,PUBLIC_R2_BASE_URL,PUBLIC_GAME_BASE_URL,PUBLIC_PLAUSIBLE_DOMAIN,PUBLIC_PLAUSIBLE_API_HOST,PUBLIC_NEWSLETTER_FORM_ID"

# No SPA fallback redirect: Astro emits a real HTML file per route, plus a
# top-level dist/404.html that Netlify serves automatically for unknown paths.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "interest-cohort=()"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
